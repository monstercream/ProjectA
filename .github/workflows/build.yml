name: Unity Build CI

on:
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: '빌드할 플랫폼 선택'
        required: true
        default: 'StandaloneWindows64'
        type: choice
        options:
          - StandaloneWindows64
          - StandaloneOSX
          - Android
          - WebGL
      branch:
        description: '빌드할 브랜치 선택'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop

jobs:
  build:
    name: 🔨 Build (${{ github.event.inputs.targetPlatform }}) on ${{ github.event.inputs.branch }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          lfs: true

      - name: 💾 Library 캐시
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ github.event.inputs.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ github.event.inputs.targetPlatform }}-
            Library-

      - name: 🔨 Unity 빌드
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ github.event.inputs.targetPlatform }}
          projectPath: . 

      - name: 📦 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ github.event.inputs.targetPlatform }}-${{ github.event.inputs.branch }}
          path: build/${{ github.event.inputs.targetPlatform }}
          retention-days: 14

      - name: 📧 빌드 완료 이메일 발송  # ← 추가된 스텝
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: chococreamcrow@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          subject: "✅ Unity 빌드 완료 - ${{ github.event.inputs.targetPlatform }} (${{ github.event.inputs.branch }})"
          body: |
            Unity 빌드가 완료되었습니다! 🎉

            📌 빌드 정보
            - 플랫폼: ${{ github.event.inputs.targetPlatform }}
            - 브랜치: ${{ github.event.inputs.branch }}
            - 커밋: ${{ github.sha }}

            📦 아티팩트 다운로드 링크:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            위 링크에서 로그인 후 Artifacts 섹션에서 빌드 파일을 다운로드할 수 있습니다.