name: Unity Build CI

on:
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: '빌드할 플랫폼 선택'
        required: true
        type: choice
        options:
          - StandaloneWindows64
          - StandaloneOSX
          - Android
          - WebGL
          - iOS
      buildAddressables:
        description: 'Addressables 빌드 및 R2 배포 여부'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: unity-build-${{ github.event.inputs.targetPlatform }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Addressables 콘텐츠 빌드 + R2 배포
  # ─────────────────────────────────────────────
  build-addressables:
    name: 📦 Addressables Build & R2 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.inputs.buildAddressables == 'true'
    steps:
      - name: 🧹 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 💾 Library 캐시
        uses: actions/cache@v3
        with:
          path: ProjectA/Library
          key: Library-${{ github.event.inputs.targetPlatform }}-${{ hashFiles('ProjectA/Packages/**', 'ProjectA/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ github.event.inputs.targetPlatform }}-
            Library-

      - name: 📦 Addressables 빌드
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ github.event.inputs.targetPlatform }}
          projectPath: ProjectA
          buildMethod: AddressablesBuildScript.BuildAddressables
          versioning: None

      - name: 🔓 빌드 결과물 권한 복구
        run: |
          sudo chown -R "$(id -u):$(id -g)" ProjectA/
          [ -d build ] && sudo chown -R "$(id -u):$(id -g)" build/ || true

      - name: 📂 Addressables 결과물 확인 및 복사
        run: |
          set -euo pipefail

          PLATFORM="${{ github.event.inputs.targetPlatform }}"
          PRIMARY_DEST="ProjectA/ServerData/$PLATFORM"

          # GitHub Actions 입력값 → Unity 내부 폴더명 변환
          case "$PLATFORM" in
            StandaloneWindows64) UNITY_PLATFORM="Windows" ;;
            StandaloneOSX)       UNITY_PLATFORM="OSX" ;;
            Android)             UNITY_PLATFORM="Android" ;;
            WebGL)               UNITY_PLATFORM="WebGL" ;;
            iOS)                 UNITY_PLATFORM="iOS" ;;
            *)                   UNITY_PLATFORM="$PLATFORM" ;;
          esac

          FALLBACK_DEST="ProjectA/Library/com.unity.addressables/aa/$UNITY_PLATFORM"

          echo "플랫폼 입력값: $PLATFORM"
          echo "Unity 내부 폴더명: $UNITY_PLATFORM"
          echo "Primary 경로: $PRIMARY_DEST"
          echo "Fallback 경로: $FALLBACK_DEST"

          # 실제 결과물 위치 탐색
          if [ -d "$PRIMARY_DEST" ] && find "$PRIMARY_DEST" -name "catalog.bin" | grep -q .; then
            echo "✅ ServerData 경로에서 결과물 발견"
          elif [ -d "$FALLBACK_DEST" ] && find "$FALLBACK_DEST" -name "catalog.bin" | grep -q .; then
            echo "⚠️  Library 경로에서 결과물 발견 → ServerData로 복사"
            mkdir -p "$PRIMARY_DEST"
            cp -r "$FALLBACK_DEST/." "$PRIMARY_DEST/"
          else
            echo "❌ Addressables 결과물을 찾을 수 없습니다."
            echo "=== 전체 탐색 결과 ==="
            find ProjectA -name "catalog.bin" 2>/dev/null || echo "(catalog.bin 없음)"
            exit 1
          fi

          echo "=== Addressables 전체 파일 구조 (디버그) ==="
          find "$PRIMARY_DEST" -type f | sort

          CATALOG_COUNT=$(find "$PRIMARY_DEST" -name "catalog.bin" | wc -l)
          BUNDLE_COUNT=$(find "$PRIMARY_DEST" -name "*.bundle" | wc -l)

          echo "번들: ${BUNDLE_COUNT}개 / 카탈로그: ${CATALOG_COUNT}개"

          if [ "$CATALOG_COUNT" -eq 0 ]; then
            echo "❌ catalog.bin이 없습니다."
            exit 1
          fi

          if [ "$BUNDLE_COUNT" -eq 0 ]; then
            echo "⚠️  번들 파일이 없습니다. Addressables 그룹에 에셋이 포함되어 있는지 확인하세요."
          fi

          echo "✅ 확인 완료"

      - name: ☁️ Cloudflare R2에 Addressables 배포
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          PLATFORM="${{ github.event.inputs.targetPlatform }}"

          aws s3 sync "ProjectA/ServerData/$PLATFORM/" \
            "s3://${{ secrets.CF_R2_BUCKET_NAME }}/$PLATFORM/" \
            --endpoint-url "${{ secrets.CF_R2_ENDPOINT }}" \
            --delete \
            --no-progress

          echo "✅ R2 배포 완료"
          echo "📡 Public URL: ${{ secrets.CF_R2_PUBLIC_URL }}/$PLATFORM/"

          echo "=== R2 업로드 파일 목록 ==="
          aws s3 ls \
            "s3://${{ secrets.CF_R2_BUCKET_NAME }}/$PLATFORM/" \
            --endpoint-url "${{ secrets.CF_R2_ENDPOINT }}" \
            --recursive

      - name: 🔍 R2 catalog 접근 검증
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          PUBLIC_URL="${{ secrets.CF_R2_PUBLIC_URL }}"
          PLATFORM="${{ github.event.inputs.targetPlatform }}"
          HASH_FILE="ProjectA/ServerData/$PLATFORM/catalog.hash"

          if [ ! -f "$HASH_FILE" ]; then
            echo "⚠️  catalog.hash 없음, 검증 건너뜀"
            exit 0
          fi

          for FILE in "catalog.bin" "catalog.hash"; do
            FULL_URL="$PUBLIC_URL/$PLATFORM/$FILE"
            echo "검증 URL: $FULL_URL"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FULL_URL")
            echo "HTTP 응답: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "❌ R2 퍼블릭 접근 실패 (HTTP $HTTP_STATUS) - $FILE"
              exit 1
            fi
            echo "✅ $FILE 접근 정상"
          done

          SAMPLE_BUNDLE=$(aws s3 ls \
            "s3://${{ secrets.CF_R2_BUCKET_NAME }}/$PLATFORM/" \
            --endpoint-url "${{ secrets.CF_R2_ENDPOINT }}" \
            | grep ".bundle" | head -1 | awk '{print $4}')

          if [ -n "$SAMPLE_BUNDLE" ]; then
            BUNDLE_URL="$PUBLIC_URL/$PLATFORM/$SAMPLE_BUNDLE"
            echo "번들 샘플 검증 URL: $BUNDLE_URL"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BUNDLE_URL")
            echo "HTTP 응답: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "❌ 번들 접근 실패 (HTTP $HTTP_STATUS)"
              exit 1
            fi
            echo "✅ 번들 접근 정상"
          fi

      - name: 📤 Addressables 결과물 업로드 (빌드 job 전달용)
        uses: actions/upload-artifact@v4
        with:
          name: Addressables-${{ github.event.inputs.targetPlatform }}-${{ github.run_id }}
          path: ProjectA/ServerData/${{ github.event.inputs.targetPlatform }}
          retention-days: 3
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # 빌드 Job (Windows / macOS / Android / WebGL)
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Build (${{ github.event.inputs.targetPlatform }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [build-addressables]
    if: |
      always() &&
      github.event.inputs.targetPlatform != 'iOS' &&
      (needs.build-addressables.result == 'success' || needs.build-addressables.result == 'skipped')
    steps:
      - name: 🧹 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 📥 Addressables 결과물 다운로드 (빌드한 경우에만)
        if: github.event.inputs.buildAddressables == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Addressables-${{ github.event.inputs.targetPlatform }}-${{ github.run_id }}
          path: ProjectA/ServerData/${{ github.event.inputs.targetPlatform }}

      - name: 💾 Library 캐시
        uses: actions/cache@v3
        with:
          path: ProjectA/Library
          key: Library-${{ github.event.inputs.targetPlatform }}-${{ hashFiles('ProjectA/Packages/**', 'ProjectA/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ github.event.inputs.targetPlatform }}-
            Library-

      - name: 🔨 Unity 빌드
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ github.event.inputs.targetPlatform }}
          projectPath: ProjectA
          versioning: None
          buildVersion: ${{ github.run_number }}

      - name: 🔓 빌드 결과물 권한 복구
        run: sudo chown -R "$(id -u):$(id -g)" build/ ProjectA/Library

      - name: 📦 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ github.event.inputs.targetPlatform }}-${{ github.ref_name }}
          path: build/${{ github.event.inputs.targetPlatform }}
          retention-days: 14

      - name: 📧 빌드 완료 이메일 발송
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: chococreamcrow@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          subject: "${{ job.status == 'success' && '✅' || '❌' }} Unity 빌드 ${{ job.status }} - ${{ github.event.inputs.targetPlatform }} (${{ github.ref_name }}) #${{ github.run_number }}"
          body: |
            Unity 빌드가 ${{ job.status }}로 완료되었습니다.

            📌 빌드 정보
            - 상태: ${{ job.status }}
            - 플랫폼: ${{ github.event.inputs.targetPlatform }}
            - 브랜치: ${{ github.ref_name }}
            - 버전: ${{ github.run_number }}
            - 커밋: ${{ github.sha }}
            - Addressables 배포: ${{ github.event.inputs.buildAddressables }}

            ${{ github.event.inputs.buildAddressables == 'true' && '☁️ Addressables R2 URL:' || '' }}
            ${{ github.event.inputs.buildAddressables == 'true' && format('{0}/{1}/', secrets.CF_R2_PUBLIC_URL, github.event.inputs.targetPlatform) || '' }}

            📦 아티팩트 다운로드:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ─────────────────────────────────────────────
  # iOS 전용 Job - Step 1: Unity → Xcode 프로젝트 생성
  # ─────────────────────────────────────────────
  build-ios-unity:
    name: 🍎 [iOS 1/2] Unity → Xcode 프로젝트 생성
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [build-addressables]
    if: |
      always() &&
      github.event.inputs.targetPlatform == 'iOS' &&
      (needs.build-addressables.result == 'success' || needs.build-addressables.result == 'skipped')
    steps:
      - name: 🧹 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 📥 Addressables 결과물 다운로드 (빌드한 경우에만)
        if: github.event.inputs.buildAddressables == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Addressables-${{ github.event.inputs.targetPlatform }}-${{ github.run_id }}
          path: ProjectA/ServerData/${{ github.event.inputs.targetPlatform }}

      - name: 💾 Library 캐시
        uses: actions/cache@v3
        with:
          path: ProjectA/Library
          key: Library-iOS-${{ hashFiles('ProjectA/Packages/**', 'ProjectA/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      - name: 🔨 Unity iOS 빌드 (Xcode 프로젝트 생성)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          projectPath: ProjectA
          versioning: None
          buildVersion: ${{ github.run_number }}

      - name: 🔓 빌드 결과물 권한 복구
        run: sudo chown -R "$(id -u):$(id -g)" build/ ProjectA/Library

      - name: 📦 Xcode 프로젝트 업로드 (다음 Job으로 전달)
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project-${{ github.run_id }}
          path: build/iOS
          retention-days: 3
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # iOS 전용 Job - Step 2: Xcode 빌드 + 서명 + IPA 출력
  # ─────────────────────────────────────────────
  build-ios-xcode:
    name: 🍎 [iOS 2/2] Xcode 빌드 & 서명 → IPA
    runs-on: macos-latest
    timeout-minutes: 60
    needs: build-ios-unity
    if: github.event.inputs.targetPlatform == 'iOS'
    steps:
      - name: 📥 Xcode 프로젝트 다운로드
        uses: actions/download-artifact@v4
        with:
          name: xcode-project-${{ github.run_id }}
          path: build/iOS

      - name: 🔐 인증서 & 프로비저닝 프로파일 설치
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS=temppass123

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" \
             ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 🏗️ Xcode 아카이브 생성
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project build/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Unity-iPhone.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}"

      - name: 📲 IPA 추출 (Ad Hoc)
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>compileBitcode</key>
            <false/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Unity-iPhone.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: 📦 IPA 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Build-iOS-${{ github.ref_name }}-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

      - name: 📧 빌드 완료 이메일 발송
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: chococreamcrow@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          subject: "${{ job.status == 'success' && '✅' || '❌' }} Unity iOS 빌드 ${{ job.status }} - (${{ github.ref_name }}) #${{ github.run_number }}"
          body: |
            Unity iOS 빌드가 ${{ job.status }}로 완료되었습니다.

            📌 빌드 정보
            - 상태: ${{ job.status }}
            - 플랫폼: iOS (Ad Hoc)
            - 브랜치: ${{ github.ref_name }}
            - 버전: ${{ github.run_number }}
            - 커밋: ${{ github.sha }}
            - Addressables 배포: ${{ github.event.inputs.buildAddressables }}

            ${{ github.event.inputs.buildAddressables == 'true' && '☁️ Addressables R2 URL:' || '' }}
            ${{ github.event.inputs.buildAddressables == 'true' && format('{0}/iOS/', secrets.CF_R2_PUBLIC_URL) || '' }}

            📲 아이폰 설치 방법:
            1. 아래 링크에서 GitHub에 로그인 후 IPA 다운로드
            2. Apple Configurator 2 (Mac) 또는 AltStore로 설치
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ⚠️  Ad Hoc 빌드이므로 사전에 UDID가 등록된 기기에서만 설치 가능합니다.