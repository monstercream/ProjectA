name: Unity Build CI
on:
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: '빌드할 플랫폼 선택'
        required: true
        default: 'StandaloneWindows64'
        type: choice
        options:
          - StandaloneWindows64
          - StandaloneOSX
          - Android
          - WebGL
          - iOS
      branch:
        description: '빌드할 브랜치 선택'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop

jobs:
  # ─────────────────────────────────────────────
  # Addressables 콘텐츠 빌드 (모든 플랫폼 공통 선행 작업)
  # ─────────────────────────────────────────────
  build-addressables:
    name: 📦 Addressables Content Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          lfs: true
          fetch-depth: 0

      - name: 💾 Library 캐시
        uses: actions/cache@v3
        with:
          path: ProjectA/Library
          key: Library-Addressables-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Addressables-
            Library-

      - name: 📦 Addressables 빌드
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ github.event.inputs.targetPlatform }}
          projectPath: ProjectA
          buildMethod: AddressablesBuildScript.BuildAddressables

      - name: 📤 Addressables 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Addressables-${{ github.event.inputs.targetPlatform }}-${{ github.run_id }}
          path: ProjectA/ServerData
          retention-days: 3

  # ─────────────────────────────────────────────
  # 기존 빌드 Job (Windows / macOS / Android / WebGL)
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Build (${{ github.event.inputs.targetPlatform }}) on ${{ github.event.inputs.branch }}
    runs-on: ubuntu-latest
    needs: build-addressables
    if: github.event.inputs.targetPlatform != 'iOS'
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          lfs: true
          fetch-depth: 0

      - name: 📥 Addressables 결과물 다운로드
        uses: actions/download-artifact@v4
        with:
          name: Addressables-${{ github.event.inputs.targetPlatform }}-${{ github.run_id }}
          path: ProjectA/ServerData

      - name: 💾 Library 캐시
        uses: actions/cache@v3
        with:
          path: ProjectA/Library
          key: Library-${{ github.event.inputs.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ github.event.inputs.targetPlatform }}-
            Library-

      - name: 🔨 Unity 빌드
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ github.event.inputs.targetPlatform }}
          projectPath: ProjectA

      - name: 📦 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ github.event.inputs.targetPlatform }}-${{ github.event.inputs.branch }}
          path: build/${{ github.event.inputs.targetPlatform }}
          retention-days: 14

      - name: 📧 빌드 완료 이메일 발송
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: chococreamcrow@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          subject: "✅ Unity 빌드 완료 - ${{ github.event.inputs.targetPlatform }} (${{ github.event.inputs.branch }})"
          body: |
            Unity 빌드가 완료되었습니다! 🎉

            📌 빌드 정보
            - 플랫폼: ${{ github.event.inputs.targetPlatform }}
            - 브랜치: ${{ github.event.inputs.branch }}
            - 커밋: ${{ github.sha }}

            📦 아티팩트 다운로드 링크:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            위 링크에서 로그인 후 Artifacts 섹션에서 빌드 파일을 다운로드할 수 있습니다.

  # ─────────────────────────────────────────────
  # iOS 전용 Job - Step 1: Unity → Xcode 프로젝트 생성
  # ubuntu-latest 에서 실행 (Unity 라이선스 활성화 가능)
  # ─────────────────────────────────────────────
  build-ios-unity:
    name: 🍎 [iOS 1/2] Unity → Xcode 프로젝트 생성
    runs-on: ubuntu-latest
    needs: build-addressables
    if: github.event.inputs.targetPlatform == 'iOS'
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          lfs: true
          fetch-depth: 0

      - name: 📥 Addressables 결과물 다운로드
        uses: actions/download-artifact@v4
        with:
          name: Addressables-${{ github.event.inputs.targetPlatform }}-${{ github.run_id }}
          path: ProjectA/ServerData

      - name: 💾 Library 캐시
        uses: actions/cache@v3
        with:
          path: ProjectA/Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      - name: 🔨 Unity iOS 빌드 (Xcode 프로젝트 생성)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          projectPath: ProjectA
          buildMethod: ''

      - name: 📦 Xcode 프로젝트 업로드 (다음 Job으로 전달)
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project-${{ github.run_id }}
          path: build/iOS
          retention-days: 1

  # ─────────────────────────────────────────────
  # iOS 전용 Job - Step 2: Xcode 빌드 + 서명 + IPA 출력
  # macOS Runner 필수
  # ─────────────────────────────────────────────
  build-ios-xcode:
    name: 🍎 [iOS 2/2] Xcode 빌드 & 서명 → IPA
    runs-on: macos-latest
    needs: build-ios-unity
    if: github.event.inputs.targetPlatform == 'iOS'
    steps:
      - name: 📥 Xcode 프로젝트 다운로드
        uses: actions/download-artifact@v4
        with:
          name: xcode-project-${{ github.run_id }}
          path: build/iOS

      # ── 인증서 설치 ──────────────────────────
      - name: 🔐 인증서 & 프로비저닝 프로파일 설치
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASS=temppass123

          # 임시 키체인 생성
          security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH

          # p12 인증서 설치
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -k $KEYCHAIN_PATH \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12
          security list-keychain -d user -s $KEYCHAIN_PATH

          # 프로비저닝 프로파일 설치
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision \
             ~/Library/MobileDevice/Provisioning\ Profiles/

      # ── Xcode 빌드 & 아카이브 ────────────────
      - name: 🏗️ Xcode 아카이브 생성
        run: |
          xcodebuild archive \
            -project build/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}"

      # ── ExportOptions 생성 & IPA 추출 ────────
      - name: 📲 IPA 추출 (Ad Hoc)
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>compileBitcode</key>
            <false/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      # ── IPA 업로드 ───────────────────────────
      - name: 📦 IPA 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Build-iOS-${{ github.event.inputs.branch }}-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

      # ── 이메일 발송 ──────────────────────────
      - name: 📧 빌드 완료 이메일 발송
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: chococreamcrow@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          subject: "✅ Unity 빌드 완료 - iOS (${{ github.event.inputs.branch }})"
          body: |
            Unity iOS 빌드가 완료되었습니다! 🎉

            📌 빌드 정보
            - 플랫폼: iOS (Ad Hoc)
            - 브랜치: ${{ github.event.inputs.branch }}
            - 커밋: ${{ github.sha }}
            - 빌드 번호: ${{ github.run_number }}

            📲 아이폰 설치 방법:
            1. 아래 링크에서 GitHub에 로그인 후 IPA 다운로드
            2. Apple Configurator 2 (Mac) 또는 AltStore로 설치
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ⚠️  Ad Hoc 빌드이므로 사전에 UDID가 등록된 기기에서만 설치 가능합니다.